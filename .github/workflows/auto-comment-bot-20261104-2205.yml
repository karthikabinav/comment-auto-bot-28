name: Automated Comment Bot
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      create_test_issues:
        description: Create the four requested integration-test issues
        required: true
        type: boolean
        default: false
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new issues or run integration tests
        uses: actions/github-script@v7
        env:
          CREATE_TEST_ISSUES: ${{ inputs.create_test_issues }}
        with:
          script: |
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const messages = {
              bug: "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.",
              feature: "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.",
              discussion: "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman."
            };
            async function commentOnIssue(issue) {
              const labels = issue.labels.map(label => typeof label === "string" ? label : label.name);
              const kind = ["bug", "feature", "discussion"].find(label => labels.includes(label));
              let body = null;
              if (kind) body = messages[kind];
              else if (labels.length === 0) body = "Hello, world!";
              if (!body) return;
              const comments = await github.paginate(github.rest.issues.listComments, { ...repository, issue_number: issue.number, per_page: 100 });
              if (comments.some(comment => comment.body === body)) { core.info("Already commented on issue " + issue.number); return; }
              await github.rest.issues.createComment({ ...repository, issue_number: issue.number, body: body });
              core.info("Commented on issue " + issue.number + ": " + body);
            }
            if (context.eventName === "issues" && context.payload.action === "opened") {
              await commentOnIssue(context.payload.issue);
            } else if (process.env.CREATE_TEST_ISSUES === "true") {
              const tests = [
                { title: "Bug report", labels: ["bug"], body: "Integration test for the automated comment bot." },
                { title: "Feature request", labels: ["feature"], body: "Integration test for the automated comment bot." },
                { title: "Documentation update", labels: [], body: "Integration test for the automated comment bot." },
                { title: "General Discussion", labels: ["discussion"], body: "Integration test for the automated comment bot." }
              ];
              for (const test of tests) {
                const result = await github.rest.issues.create({ ...repository, title: test.title, labels: test.labels, body: test.body });
                await commentOnIssue(result.data);
                core.info("Created test issue: " + result.data.html_url);
              }
            }
