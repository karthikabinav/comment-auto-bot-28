name: Automated Comment Bot

on:
  issues:
    types: [opened]

jobs:
  comment-bot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const owner = "karthikabinav";
            let body = null;
            if (labels.includes("bug")) {
              body = `Thank you. We will fix it. Best regards, ${owner}.`;
            } else if (labels.includes("feature")) {
              body = `Thank you, we will consider to include this feature. Best regards, ${owner}.`;
            } else if (labels.includes("discussion")) {
              body = `Happy to discuss this topic with you. Best regards, ${owner}.`;
            } else {
              body = "Hello, world!";
            }
            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body
              });
            }