name: Super Cool Comment Bot 28
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const owner = "karthikabinav";
            let body = "";
            if (labels.includes("bug")) {
              body = `Thank you. We will fix it. Best regards, ${owner}.`;
            } else if (labels.includes("feature")) {
              body = `Thank you, we will consider to include this feature. Best regards, ${owner}.`;
            } else if (labels.includes("discussion")) {
              body = `Happy to discuss this topic with you. Best regards, ${owner}.`;
            } else {
              body = "Hello, world!";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: body
            });
