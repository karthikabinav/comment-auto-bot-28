name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Auto comment based on labels
        uses: actions/github-script@v7
        with:
          script: |
            const ownerName = 'Karthik Abinav Sankararaman';
            const messages = {
              bug: `Thank you. We will fix it. Best regards, ${ownerName}.`,
              feature: `Thank you, we will consider to include this feature. Best regards, ${ownerName}.`,
              discussion: `Happy to discuss this topic with you. Best regards, ${ownerName}.`
            };
            const labels = context.payload.issue.labels.map(l => l.name);
            let body = null;
            if (labels.includes('bug')) {
              body = messages.bug;
            } else if (labels.includes('feature')) {
              body = messages.feature;
            } else if (labels.includes('discussion')) {
              body = messages.discussion;
            }
            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
