name: Automated Comment Bot
on:
  issues:
    types: [opened]
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on bug
        if: contains(github.event.issue.labels.*.name, bug)
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment on feature
        if: contains(github.event.issue.labels.*.name, feature)
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment on discussion
        if: contains(github.event.issue.labels.*.name, discussion)
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}