name: Comment Auto Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

# Owner: karthikabinav - Karthik Abinav Sankararaman
# This workflow comments based on labels:
# - bug: "Thank you. We will fix it. Best regards, karthikabinav."
# - bug alt: "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman."
# - feature: "Thank you, we will consider to include this feature. Best regards, karthikabinav."
# - feature alt: "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman."
# - discussion: "Happy to discuss this topic with you. Best regards, karthikabinav."
# - discussion alt: "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman."

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on bug issues
        if: contains(github.event.issue.labels.*.name, 'bug')
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Thank you. We will fix it. Best regards, karthikabinav."
      - name: Comment on feature issues
        if: contains(github.event.issue.labels.*.name, 'feature')
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Thank you, we will consider to include this feature. Best regards, karthikabinav."
      - name: Comment on discussion issues
        if: contains(github.event.issue.labels.*.name, 'discussion')
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Happy to discuss this topic with you. Best regards, karthikabinav."
