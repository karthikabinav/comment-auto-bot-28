name: Auto Comment Bot
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on issue labels
        uses: actions/github-script@v7
        with:
          script: |\n            const ownerName = "karthikabinav";
            const issueNumber = context.issue.number;
            const labels = context.payload.issue.labels.map(l => l.name);
            
            let commentBody = "";
            
            if (labels.includes("bug")) {
              commentBody = `Thank you. We will fix it. Best regards, ${ownerName}.`;
            } else if (labels.includes("feature")) {
              commentBody = `Thank you, we will consider to include this feature. Best regards, ${ownerName}.`;
            } else if (labels.includes("discussion")) {
              commentBody = `Happy to discuss this topic with you. Best regards, ${ownerName}.`;
            } else {
              commentBody = `Hello, world!`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });
