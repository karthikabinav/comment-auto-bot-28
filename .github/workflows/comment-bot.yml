name: Automated Comment Bot

on:
  issues:
    types: [opened]

jobs:
  comment-on-new-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labelNames = issue.labels.map((label) => label.name);
            let message = null;
            if (labelNames.includes("bug")) {
              message = "Thank you. We will fix it. Best regards, karthikabinav.";
            } else if (labelNames.includes("feature")) {
              message = "Thank you, we will consider to include this feature. Best regards, karthikabinav.";
            } else if (labelNames.includes("discussion")) {
              message = "Happy to discuss this topic with you. Best regards, karthikabinav.";
            }
            if (message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });
            }
