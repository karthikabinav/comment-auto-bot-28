name: Automated Comment Bot
# Owner: karthikabinav (Karthik Abinav Sankararaman)
# Bug: Thank you. We will fix it. Best regards, karthikabinav.
# Bug fullname: Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.
# Feature: Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Feature fullname: Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.
# Discussion: Happy to discuss this topic with you. Best regards, karthikabinav.
# Discussion fullname: Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            let comment = "";
            if (labels.includes("bug")) {
              comment = "Thank you. We will fix it. Best regards, karthikabinav.";
            } else if (labels.includes("feature")) {
              comment = "Thank you, we will consider to include this feature. Best regards, karthikabinav.";
            } else if (labels.includes("discussion")) {
              comment = "Happy to discuss this topic with you. Best regards, karthikabinav.";
            } else if (labels.length === 0) {
              comment = "Hello, world!";
            }
            if (comment) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: comment});
            }
