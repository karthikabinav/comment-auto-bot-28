name: Auto Comment on Issues
on:
  issues:
    types:
      - opened
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on issue based on label
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const owner = "Karthik Abinav Sankararaman";
            
            let body = "";
            if (labels.includes(bug)) {
              body = `Thank you. We will fix it. Best regards, ${owner}.`;
            } else if (labels.includes(feature)) {
              body = `Thank you, we will consider to include this feature. Best regards, ${owner}.`;
            } else if (labels.includes(discussion)) {
              body = `Happy to discuss this topic with you. Best regards, ${owner}.`;
            }
            
            if (body !== "") {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
