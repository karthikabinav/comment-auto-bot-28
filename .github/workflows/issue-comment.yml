name: Comment on Issues

on:
  issues:
    types: [labeled]

jobs:
  comment-on-label:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            let message = '';
            if (label === 'bug') {
              message = 'Thank you. We will fix it. Best regards, karthikabinav.';
            } else if (label === 'feature') {
              message = 'Thank you, we will consider to include this feature. Best regards, karthikabinav.';
            } else if (label === 'discussion') {
              message = 'Happy to discuss this topic with you. Best regards, karthikabinav.';
            }
            if (message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }
