name: Issue Auto Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on the issue label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner; // repository owner: karthikabinav
            const labels = (context.payload.issue.labels || []).map(l => l.name);
            let body = null;
            if (labels.includes('bug')) {
              body = `Thank you. We will fix it. Best regards, ${owner}.`;
            } else if (labels.includes('feature')) {
              body = `Thank you, we will consider to include this feature. Best regards, ${owner}.`;
            } else if (labels.includes('discussion')) {
              body = `Happy to discuss this topic with you. Best regards, ${owner}.`;
            }
            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: body,
              });
            }
