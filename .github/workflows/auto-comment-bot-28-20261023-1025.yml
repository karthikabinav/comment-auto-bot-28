name: Automated Comment Bot

# Watches for newly opened issues and replies based on the issue's labels.
# Repository owner: karthikabinav

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment-on-new-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on issue labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const replies = {
              bug: 'Thank you. We will fix it. Best regards, karthikabinav.',
              feature: 'Thank you, we will consider to include this feature. Best regards, karthikabinav.',
              discussion: 'Happy to discuss this topic with you. Best regards, karthikabinav.'
            };
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(label => label.name.toLowerCase());
            for (const [label, body] of Object.entries(replies)) {
              if (labels.includes(label)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body
                });
                core.info(`Commented on issue #${issue.number} for label "${label}".`);
              }
            }
