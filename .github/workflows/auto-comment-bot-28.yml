name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const ownerName = 'Karthik Abinav Sankararaman';
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            let body = null;
            if (labels.includes('bug')) {
              body = `Thank you. We will fix it. Best regards, ${ownerName}.`;
            } else if (labels.includes('feature')) {
              body = `Thank you, we will consider to include this feature. Best regards, ${ownerName}.`;
            } else if (labels.includes('discussion')) {
              body = `Happy to discuss this topic with you. Best regards, ${ownerName}.`;
            } else if (labels.length === 0) {
              body = 'Hello, world!';
            }
            if (!body) return;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
            if (comments.some(c => c.body === body)) {
              core.info(`Issue #${issue.number} already has expected comment`);
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
