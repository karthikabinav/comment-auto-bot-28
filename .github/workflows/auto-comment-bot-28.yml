name: Automated Comment Bot

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to test
        required: true
        type: number

permissions:
  issues: write

concurrency:
  group: comment-auto-bot-28-canonical-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment on issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number ?? Number(context.payload.inputs?.issue_number);
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              throw new Error("A positive integer issue number is required.");
            }
            const supported = ["bug", "feature", "discussion"];
            if (context.eventName === "issues" && context.payload.action === "labeled" &&
                !supported.includes(context.payload.label?.name)) {
              return;
            }
            const params = { ...context.repo, issue_number: issueNumber };
            const { data: issue } = await github.rest.issues.get(params);
            if (issue.pull_request) {
              throw new Error("This workflow only comments on issues, not pull requests.");
            }
            const labels = new Set(issue.labels.map(label => typeof label === "string" ? label : label.name));
            let body = null;
            if (labels.has("bug")) {
              body = "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.has("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.has("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.size === 0) {
              body = "Hello, world!";
            }
            if (!body) {
              core.info("No configured response for these labels.");
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            if (comments.some(comment => comment.user?.login === "github-actions[bot]" && comment.body === body)) {
              core.info("The expected automated response already exists.");
              return;
            }
            await github.rest.issues.createComment({ ...params, body });
