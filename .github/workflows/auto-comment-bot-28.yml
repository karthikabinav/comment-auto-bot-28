name: Automated Comment Bot
# Owner: karthikabinav (Karthik Abinav Sankararaman)
# Bug: Thank you. We will fix it. Best regards, karthikabinav.
# Bug fullname: Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.
# Feature: Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Feature fullname: Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.
# Discussion: Happy to discuss this topic with you. Best regards, karthikabinav.
# Discussion fullname: Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.
# No label comment: Hello, world!
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment according to issue labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = new Set(context.payload.issue.labels.map(label => label.name));
            const messages = [
              ["bug", "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman."],
              ["feature", "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman."],
              ["discussion", "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman."]
            ];
            const bodies = messages.filter(([label]) => labels.has(label)).map(([, message]) => message);
            if (labels.size === 0) bodies.push("Hello, world!");
            if (bodies.length === 0) return;
            const parameters = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...parameters, per_page: 100 });
            for (const body of bodies) {
              if (comments.some(comment => comment.body === body)) continue;
              await github.rest.issues.createComment({ ...parameters, body });
            }
