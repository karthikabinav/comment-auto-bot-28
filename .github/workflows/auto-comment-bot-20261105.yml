name: Automated Comment Bot
# Repository owner: Karthik Abinav Sankararaman (karthikabinav)
# Bug: Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.
# Feature: Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.
# Discussion: Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.
# Bug (login): Thank you. We will fix it. Best regards, karthikabinav.
# Feature (login): Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Discussion (login): Happy to discuss this topic with you. Best regards, karthikabinav.
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            const ownerName = "Karthik Abinav Sankararaman";
            let body = null;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.length === 0) {
              body = "Hello, world!";
            }
            if (body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                per_page: 100
              });
              if (!comments.some(comment => comment.body === body)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: body
                });
              }
            }
