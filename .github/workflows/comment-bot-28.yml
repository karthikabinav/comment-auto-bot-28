name: Automated Comment Bot

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment based on label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            let comment = "Hello, world!";
            if (labels.includes("bug")) {
              comment = "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("feature")) {
              comment = "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("discussion")) {
              comment = "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.";
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });