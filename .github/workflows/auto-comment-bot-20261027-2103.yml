name: Automated Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to test or retry
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: comment-auto-bot-28-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add comment based on issue label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(context.payload.issue?.number || context.payload.inputs?.issue_number);
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
              core.setFailed("A positive issue number is required.");
              return;
            }
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.pull_request) return;
            const labels = issue.labels.map(label => typeof label === "string" ? label : label.name);
            let body;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.length === 0) {
              body = "Hello, world!";
            }
            if (!body) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            if (!comments.some(comment => comment.body === body)) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
