name: Automated Comment Bot
# Repository owner: Karthik Abinav Sankararaman (karthikabinav)
# Owner name: Karthik Abinav Sankararaman, Owner login: karthikabinav
# Bug: Thank you. We will fix it. Best regards, karthikabinav.
# Feature: Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Discussion: Happy to discuss this topic with you. Best regards, karthikabinav.
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on bug reports
        if: contains(github.event.issue.labels.*.name, 'bug')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman."});
      - name: Comment on feature requests
        if: contains(github.event.issue.labels.*.name, 'feature')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman."});
      - name: Comment on discussions
        if: contains(github.event.issue.labels.*.name, 'discussion')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman."});
