name: Automated Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to test the comment bot against
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: comment-auto-bot-28-auto-comment-yml-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment according to the issue labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let issue = context.payload.issue;
            if (!issue) {
              const rawNumber = context.payload.inputs.issue_number;
              const issueNumber = Number(rawNumber);
              if (!/^\d+$/.test(rawNumber) || !Number.isSafeInteger(issueNumber) || issueNumber < 1) {
                throw new Error('issue_number must be a positive integer');
              }
              ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber }));
            }
            if (issue.pull_request) return;
            const labels = new Set(issue.labels.map(label => typeof label === 'string' ? label : label.name));
            let body;
            // If multiple matching labels are present, bug takes precedence, then feature, then discussion.
            if (labels.has('bug')) {
              body = 'Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.';
            } else if (labels.has('feature')) {
              body = 'Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.';
            } else if (labels.has('discussion')) {
              body = 'Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.';
            } else if (labels.size === 0) {
              body = 'Hello, world!';
            } else {
              return;
            }
            const parameters = { owner, repo, issue_number: issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...parameters, per_page: 100 });
            if (comments.some(comment => comment.user?.type === 'Bot' && comment.body === body)) return;
            await github.rest.issues.createComment({ ...parameters, body });
