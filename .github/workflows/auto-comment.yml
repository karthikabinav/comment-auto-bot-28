name: Auto Comment on Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            const owner = context.repo.owner;
            let body;
            if (labels.includes('bug')) {
              body = `Thank you. We will fix it. Best regards, ${owner}.`;
            } else if (labels.includes('feature')) {
              body = `Thank you, we will consider to include this feature. Best regards, ${owner}.`;
            } else if (labels.includes('discussion')) {
              body = `Happy to discuss this topic with you. Best regards, ${owner}.`;
            } else {
              body = `Hello, world!`;
            }
            await github.rest.issues.createComment({
              owner: owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
