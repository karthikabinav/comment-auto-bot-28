name: Auto Comment Bot
on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Comment on bug issues
        if: contains(github.event.issue.labels.*.name, 'bug')
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Thank you. We will fix it. Best regards, karthikabinav."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment on feature issues
        if: contains(github.event.issue.labels.*.name, 'feature')
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Thank you, we will consider to include this feature. Best regards, karthikabinav."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment on discussion issues
        if: contains(github.event.issue.labels.*.name, 'discussion')
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Happy to discuss this topic with you. Best regards, karthikabinav."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
