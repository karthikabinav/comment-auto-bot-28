name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: comment-auto-bot-28-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reply to the new issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labels = context.payload.issue.labels.map(label =>
              typeof label === "string" ? label : label.name
            );
            const repoOwner = "Karthik Abinav Sankararaman";

            let body;
            if (labels.includes("bug")) {
              body = `Thank you. We will fix it. Best regards, ${repoOwner}.`;
            } else if (labels.includes("feature")) {
              body = `Thank you, we will consider to include this feature. Best regards, ${repoOwner}.`;
            } else if (labels.includes("discussion")) {
              body = `Happy to discuss this topic with you. Best regards, ${repoOwner}.`;
            } else if (labels.length === 0) {
              body = "Hello, world!";
            } else {
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            if (comments.some(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body === body
            )) {
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number, body
            });
