name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: auto-comment-bot-28-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add comment based on issue label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;
            const labels = new Set((issue.labels || []).map(label => label.name));
            const ownerName = "Karthik Abinav Sankararaman";
            let body;
            if (labels.has("bug")) {
              body = `Thank you. We will fix it. Best regards, ${ownerName}.`;
            } else if (labels.has("feature")) {
              body = `Thank you, we will consider to include this feature. Best regards, ${ownerName}.`;
            } else if (labels.has("discussion")) {
              body = `Happy to discuss this topic with you. Best regards, ${ownerName}.`;
            } else if (labels.size === 0) {
              body = "Hello, world!";
            } else {
              return;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            if (comments.some(comment => comment.body === body)) return;
            await github.rest.issues.createComment({ ...params, body });
