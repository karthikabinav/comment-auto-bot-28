name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reply to the new issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const repoOwnerName = "Karthik Abinav Sankararaman";
            const replies = {
              bug: `Thank you. We will fix it. Best regards, ${repoOwnerName}.`,
              feature: `Thank you, we will consider to include this feature. Best regards, ${repoOwnerName}.`,
              discussion: `Happy to discuss this topic with you. Best regards, ${repoOwnerName}.`
            };

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function withRetry(request, attempts = 6) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await request();
                } catch (error) {
                  const retriable = error.status === 429 || error.status >= 500 ||
                    (error.status === 403 && /rate limit/i.test(error.message));
                  if (!retriable || attempt >= attempts) throw error;
                  const retryAfter = Number(error.response?.headers?.["retry-after"]);
                  const delaySeconds = retryAfter > 0 ? retryAfter : 15 * attempt;
                  core.warning(`GitHub API returned ${error.status}; retrying in ${delaySeconds}s.`);
                  await sleep(delaySeconds * 1000);
                }
              }
            }

            const issueNumber = context.payload.issue.number;
            let labels = (context.payload.issue.labels || []).map(label => label.name.toLowerCase());
            if (labels.length === 0) {
              const { data } = await withRetry(() => github.rest.issues.listLabelsOnIssue({
                ...context.repo,
                issue_number: issueNumber
              }));
              labels = data.map(label => label.name.toLowerCase());
            }

            const bodies = Object.entries(replies)
              .filter(([label]) => labels.includes(label))
              .map(([, body]) => body);
            if (labels.length === 0) bodies.push("Hello, world!");
            if (bodies.length === 0) return;

            // Do not duplicate a reply when a workflow run is retried.
            const comments = await withRetry(() => github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100
            }));
            for (const body of bodies) {
              if (comments.some(comment => comment.user?.type === "Bot" && comment.body === body)) continue;
              await withRetry(() => github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body
              }));
            }
