name: Automated Comment Bot
# Repository owner: Karthik Abinav Sankararaman (karthikabinav)
# Owner name: Karthik Abinav Sankararaman, Owner login: karthikabinav
# Bug message (full name): Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.
# Bug message (login): Thank you. We will fix it. Best regards, karthikabinav.
# Feature message (full name): Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.
# Feature message (login): Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Discussion message (full name): Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.
# Discussion message (login): Happy to discuss this topic with you. Best regards, karthikabinav.
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            let body = "";
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.";
            } else if (labels.includes("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.";
            } else {
              body = "Hello, world!";
            }
            if (body) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: body});
            }
