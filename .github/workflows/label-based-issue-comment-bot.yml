name: Label-Based Issue Comment Bot

# Watches for newly opened issues and replies according to the issue's label.
# Replies are signed by the repository owner: karthikabinav.
#   bug        -> "Thank you. We will fix it. Best regards, karthikabinav."
#   feature    -> "Thank you, we will consider to include this feature. Best regards, karthikabinav."
#   discussion -> "Happy to discuss this topic with you. Best regards, karthikabinav."
# Issues without any of these labels get no automated reply.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  reply-to-new-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Reply based on the issue label
        uses: actions/github-script@v7
        with:
          script: |
            const replies = {
              bug: 'Thank you. We will fix it. Best regards, karthikabinav.',
              feature: 'Thank you, we will consider to include this feature. Best regards, karthikabinav.',
              discussion: 'Happy to discuss this topic with you. Best regards, karthikabinav.'
            };
            const labels = (context.payload.issue.labels || []).map((label) => String(label.name || label).toLowerCase());
            const matched = Object.keys(replies).filter((name) => labels.includes(name));
            if (matched.length === 0) {
              core.info('No bug/feature/discussion label found, so no automated reply is posted.');
              return;
            }
            for (const name of matched) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: replies[name]
              });
              core.info(`Posted the "${name}" reply on issue #${context.issue.number}.`);
            }
