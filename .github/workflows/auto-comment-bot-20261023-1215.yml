name: Automated Comment Bot
# Owner login: karthikabinav
# Owner fullname: Karthik Abinav Sankararaman
# Bug login: Thank you. We will fix it. Best regards, karthikabinav.
# Bug fullname: Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.
# Feature login: Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Feature fullname: Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.
# Discussion login: Happy to discuss this topic with you. Best regards, karthikabinav.
# Discussion fullname: Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.
# No label comment: Hello, world!
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on bug issues
        if: contains(github.event.issue.labels.*.name, 'bug')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thank you. We will fix it. Best regards, karthikabinav.'
            })
      - name: Comment on feature issues
        if: contains(github.event.issue.labels.*.name, 'feature')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thank you, we will consider to include this feature. Best regards, karthikabinav.'
            })
      - name: Comment on discussion issues
        if: contains(github.event.issue.labels.*.name, 'discussion')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Happy to discuss this topic with you. Best regards, karthikabinav.'
            })
      - name: Comment on issues with no label
        if: ${{ join(github.event.issue.labels.*.name, ',') == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Hello, world!'
            })
