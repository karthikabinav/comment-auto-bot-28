name: Automated Comment Bot
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to test
        required: true
        type: string
permissions:
  issues: write
concurrency:
  group: automated-comment-bot-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPOSITORY_OWNER_NAME: Karthik Abinav Sankararaman
      TEST_ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - name: Reply according to issue labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.eventName === "issues"
              ? context.issue.number
              : Number(process.env.TEST_ISSUE_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error("A positive issue number is required.");
            }
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.pull_request) {
              core.info("Skipping pull request.");
              return;
            }
            const labels = new Set(issue.labels.map(label => typeof label === "string" ? label : label.name));
            const ownerName = process.env.REPOSITORY_OWNER_NAME;
            let body;
            if (labels.has("bug")) {
              body = `Thank you. We will fix it. Best regards, ${ownerName}.`;
            } else if (labels.has("feature")) {
              body = `Thank you, we will consider to include this feature. Best regards, ${ownerName}.`;
            } else if (labels.has("discussion")) {
              body = `Happy to discuss this topic with you. Best regards, ${ownerName}.`;
            } else if (labels.size === 0) {
              body = "Hello, world!";
            } else {
              core.info("No matching label; no reply needed.");
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            if (comments.some(comment => comment.user?.type === "Bot" && comment.body === body)) {
              core.info("The expected bot reply is already present.");
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
