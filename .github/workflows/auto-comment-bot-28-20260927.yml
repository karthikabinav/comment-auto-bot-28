name: Automated Comment Bot

on:
  issues:
    types: [opened]

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const ownerName = context.repo.owner;
            const labels = context.payload.issue.labels.map((label) => label.name);
            let body = "";
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it. Best regards, " + ownerName + ".";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, " + ownerName + ".";
            } else if (labels.includes("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, " + ownerName + ".";
            }
            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: body
              });
            }
