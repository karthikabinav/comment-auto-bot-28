name: Issue Comment Bot

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on new issues based on label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map((label) => label.name);
            const owner = context.repo.owner;
            const issueNumber = context.payload.issue.number;
            let body = null;
            if (labels.includes(bug)) {
              body = `Thank you. We will fix it. Best regards, ${owner}.`;
            } else if (labels.includes(feature)) {
              body = `Thank you, we will consider to include this feature. Best regards, ${owner}.`;
            } else if (labels.includes(discussion)) {
              body = `Happy to discuss this topic with you. Best regards, ${owner}.`;
            }
            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }
