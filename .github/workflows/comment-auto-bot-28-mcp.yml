name: Comment Auto Bot 28 MCP

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment-on-new-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Add label-based comment
        uses: actions/github-script@v7
        with:
          script: |
            const repoOwnerName = "Karthik Abinav Sankararaman";
            const labels = (context.payload.issue.labels || []).map(label => label.name);
            let body;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it. Best regards, " + repoOwnerName + ".";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, " + repoOwnerName + ".";
            } else if (labels.includes("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, " + repoOwnerName + ".";
            } else {
              body = "Hello, world!";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
