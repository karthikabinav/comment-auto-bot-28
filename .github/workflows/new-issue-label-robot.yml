name: New Issue Label Robot

# Watches for newly opened issues and replies based on the issue's label:
#   bug        -> "Thank you. We will fix it. Best regards, karthikabinav."
#   feature    -> "Thank you, we will consider to include this feature. Best regards, karthikabinav."
#   discussion -> "Happy to discuss this topic with you. Best regards, karthikabinav."
# Issues without one of these labels do not get an automatic reply.
#
# The robot can also be started manually ("Run workflow") for an existing issue,
# e.g. when GitHub Actions dropped the original "opened" event because too many
# workflow runs were queued at the same time.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Number of an existing issue to reply to
        required: true
        type: string

permissions:
  issues: write

jobs:
  label-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reply to the issue based on its label
        uses: actions/github-script@v7
        with:
          script: |
            // Replies signed with the repository owner's name (karthikabinav).
            const replies = {
              bug: "Thank you. We will fix it. Best regards, karthikabinav.",
              feature: "Thank you, we will consider to include this feature. Best regards, karthikabinav.",
              discussion: "Happy to discuss this topic with you. Best regards, karthikabinav."
            };

            // Retry helper so a temporary API rate limit or server error does not drop a reply.
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function withRetry(request, attempts = 8) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await request();
                } catch (error) {
                  const status = error.status || 0;
                  const retriable = status === 429 || status >= 500 ||
                    (status === 403 && /rate limit|secondary|abuse/i.test(error.message || ""));
                  if (!retriable || attempt >= attempts) throw error;
                  const headers = (error.response && error.response.headers) || {};
                  const retryAfter = Number(headers["retry-after"]);
                  const delaySeconds = retryAfter > 0 ? Math.min(retryAfter, 300) : Math.min(30 * attempt, 300);
                  core.warning(`GitHub API returned ${status}; retrying in ${delaySeconds}s (attempt ${attempt} of ${attempts}).`);
                  await sleep(delaySeconds * 1000);
                }
              }
            }

            const payloadIssue = context.payload.issue;
            const issueNumber = payloadIssue
              ? payloadIssue.number
              : Number((context.payload.inputs || {}).issue_number);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("A valid issue number is required.");
              return;
            }

            let labels = ((payloadIssue && payloadIssue.labels) || []).map(label => label.name.toLowerCase());
            if (labels.length === 0) {
              // Look the labels up via the API (manual runs, or labels missing from the event payload).
              const { data } = await withRetry(() => github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              }));
              labels = data.map(label => label.name.toLowerCase());
            }

            let replied = false;
            for (const [label, body] of Object.entries(replies)) {
              if (!labels.includes(label)) continue;
              await withRetry(() => github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              }));
              replied = true;
              core.info(`Commented on issue #${issueNumber} for the "${label}" label.`);
            }

            if (!replied) {
              core.info(`Issue #${issueNumber} has no bug, feature or discussion label, so no comment was added.`);
            }
