name: Automated Comment Bot
# Repository owner: Karthik Abinav Sankararaman (karthikabinav)
# Bug comment: Thank you. We will fix it. Best regards, Karthik Abinav Sankararaman.
# Bug comment (login): Thank you. We will fix it. Best regards, karthikabinav.
# Feature comment: Thank you, we will consider to include this feature. Best regards, Karthik Abinav Sankararaman.
# Feature comment (login): Thank you, we will consider to include this feature. Best regards, karthikabinav.
# Discussion comment: Happy to discuss this topic with you. Best regards, Karthik Abinav Sankararaman.
# Discussion comment (login): Happy to discuss this topic with you. Best regards, karthikabinav.
# No label comment: Hello, world!
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            let body = null;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it. Best regards, karthikabinav.";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature. Best regards, karthikabinav.";
            } else if (labels.includes("discussion")) {
              body = "Happy to discuss this topic with you. Best regards, karthikabinav.";
            }
            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
